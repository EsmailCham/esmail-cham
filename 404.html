<!DOCTYPE html>
<html lang="fa" dir="rtl" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحه پیدا نشد | اسماعیل چام</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .notfound {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 18px;
      padding: 120px 24px 60px;
      position: relative;
      overflow: hidden;
    }
    .notfound .code {
      direction: ltr;
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.04em;
      background: linear-gradient(180deg, var(--text) 20%, var(--text-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .notfound h1 { font-size: 1.4rem; font-weight: 700; }
    .notfound p { color: var(--text-2); max-width: 420px; }
    .notfound .hero-cta { justify-content: center; margin-top: 8px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="اسماعیل چام — صفحه اصلی">
        <span class="brand-avatar">
          <img src="https://uploadkon.ir/uploads/c16e01_26profil.png" alt="آواتار اسماعیل چام" width="42" height="42">
        </span>
        <span class="brand-text">
          <span class="brand-name">اسماعیل چام</span>
          <span class="brand-tag">WordPress &bull; HTML &bull; Scripts</span>
        </span>
      </a>
      <div class="header-actions">
        <button class="icon-btn theme-toggle" data-theme-toggle aria-label="تغییر حالت روشن و تاریک">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="notfound">
    <span class="code" aria-hidden="true">404</span>
    <h1>این صفحه پیدا نشد</h1>
    <p>ممکن است آدرس تغییر کرده باشد یا صفحه حذف شده باشد. از دکمه‌های زیر استفاده کنید.</p>
    <div class="hero-cta">
      <a class="btn btn-primary btn-lg" href="index.html">
        بازگشت به خانه
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <a class="btn btn-ghost btn-lg" href="products.html">مشاهده محصولات</a>
    </div>
  </main>

  <div class="page-transition" id="pageTransition" aria-hidden="true"></div>

  <script src="js/main.js"></script>
</body>
</html>
